<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quota OpenAI - StockTraders AI</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #161925;
    --panel2: #1d2130;
    --border: #2a2f42;
    --text: #e7e9f0;
    --muted: #9aa0b4;
    --accent: #7c6cf6;
    --accent2: #4fd1c5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
  select, button {
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); font-weight: 600; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }
  .card .label { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .card .value { font-size: 22px; font-weight: 700; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 12px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 14px; font-size: 13px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; }
  tr:last-child td { border-bottom: none; }
  .bar-wrap { display: flex; align-items: center; gap: 8px; min-width: 220px; }
  .bar-track { flex: 1; height: 8px; background: var(--panel2); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  .route-name { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
  .muted { color: var(--muted); }
  #error { color: #ff6b6b; margin: 16px 0; display: none; }
  #loading { color: var(--muted); padding: 20px 0; }
  section { margin-bottom: 28px; }
  h2 { font-size: 15px; margin: 0 0 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
</style>
</head>
<body>
  <h1>Quota API OpenAI theo khâu</h1>
  <div class="sub">Chỉ dành cho Super Admin — dùng chung phiên đăng nhập với trang quản trị.</div>

  <div class="toolbar">
    <select id="daysSelect">
      <option value="1">24 giờ qua</option>
      <option value="7">7 ngày qua</option>
      <option value="30" selected>30 ngày qua</option>
      <option value="90">90 ngày qua</option>
    </select>
    <button class="primary" id="refreshBtn">Làm mới</button>
    <span id="lastUpdated" class="muted" style="font-size:12px;"></span>
  </div>

  <div id="error"></div>
  <div id="loading">Đang tải dữ liệu...</div>

  <div id="content" style="display:none;">
    <div class="cards" id="summaryCards"></div>

    <section>
      <h2>Tổng theo khâu (route)</h2>
      <table>
        <thead>
          <tr>
            <th>Khâu</th>
            <th>Số request</th>
            <th>Prompt tokens</th>
            <th>Completion tokens</th>
            <th>Tổng tokens</th>
            <th>Tỷ trọng</th>
            <th>Lần cuối</th>
          </tr>
        </thead>
        <tbody id="routeTableBody"></tbody>
      </table>
    </section>

    <section>
      <h2>Theo ngày (tổng tokens toàn bộ)</h2>
      <table>
        <thead>
          <tr><th>Ngày</th><th>Số request</th><th>Tổng tokens</th></tr>
        </thead>
        <tbody id="dayTableBody"></tbody>
      </table>
    </section>
  </div>

<script>
  const errorEl = document.getElementById('error');
  const loadingEl = document.getElementById('loading');
  const contentEl = document.getElementById('content');
  const daysSelect = document.getElementById('daysSelect');
  const refreshBtn = document.getElementById('refreshBtn');
  const lastUpdatedEl = document.getElementById('lastUpdated');

  function fmt(n) {
    return Number(n || 0).toLocaleString('vi-VN');
  }

  function fmtDate(s) {
    if (!s) return '-';
    try {
      const d = new Date(s.includes('T') ? s : s.replace(' ', 'T') + 'Z');
      return d.toLocaleString('vi-VN', { hour12: false });
    } catch {
      return s;
    }
  }

  async function load() {
    errorEl.style.display = 'none';
    loadingEl.style.display = 'block';
    contentEl.style.display = 'none';

    const days = daysSelect.value;
    try {
      const res = await fetch(`/admin/ai-usage/by-route?days=${encodeURIComponent(days)}`, {
        credentials: 'same-origin',
      });
      if (res.status === 401 || res.status === 403) {
        throw new Error('Chưa đăng nhập hoặc không đủ quyền Super Admin. Hãy đăng nhập ở trang quản trị chính trước, cùng trình duyệt, cùng tab.');
      }
      if (!res.ok) {
        throw new Error(`Lỗi API: HTTP ${res.status}`);
      }
      const data = await res.json();
      render(data);
    } catch (err) {
      errorEl.textContent = err.message || String(err);
      errorEl.style.display = 'block';
    } finally {
      loadingEl.style.display = 'none';
    }
  }

  function render(data) {
    contentEl.style.display = 'block';
    lastUpdatedEl.textContent = 'Cập nhật lúc ' + new Date().toLocaleTimeString('vi-VN', { hour12: false });

    const byRoute = data.by_route || [];
    const byDay = data.by_day || [];

    const totalRequests = byRoute.reduce((s, r) => s + (r.request_count || 0), 0);
    const totalTokens = byRoute.reduce((s, r) => s + (r.total_tokens || 0), 0);
    const totalPrompt = byRoute.reduce((s, r) => s + (r.prompt_tokens || 0), 0);
    const totalCompletion = byRoute.reduce((s, r) => s + (r.completion_tokens || 0), 0);

    const summaryCards = document.getElementById('summaryCards');
    summaryCards.innerHTML = `
      <div class="card"><div class="label">Tổng số request</div><div class="value">${fmt(totalRequests)}</div></div>
      <div class="card"><div class="label">Tổng tokens</div><div class="value">${fmt(totalTokens)}</div></div>
      <div class="card"><div class="label">Prompt tokens</div><div class="value">${fmt(totalPrompt)}</div></div>
      <div class="card"><div class="label">Completion tokens</div><div class="value">${fmt(totalCompletion)}</div></div>
      <div class="card"><div class="label">Số khâu khác nhau</div><div class="value">${fmt(byRoute.length)}</div></div>
    `;

    const maxTokens = Math.max(1, ...byRoute.map((r) => r.total_tokens || 0));
    const routeBody = document.getElementById('routeTableBody');
    if (!byRoute.length) {
      routeBody.innerHTML = `<tr><td colspan="7" class="muted">Chưa có dữ liệu trong khoảng thời gian này.</td></tr>`;
    } else {
      routeBody.innerHTML = byRoute.map((r) => {
        const pct = totalTokens ? ((r.total_tokens || 0) / totalTokens * 100) : 0;
        const barPct = (r.total_tokens || 0) / maxTokens * 100;
        return `
          <tr>
            <td class="route-name">${escapeHtml(r.route || '(không rõ)')}</td>
            <td>${fmt(r.request_count)}</td>
            <td>${fmt(r.prompt_tokens)}</td>
            <td>${fmt(r.completion_tokens)}</td>
            <td>${fmt(r.total_tokens)}</td>
            <td>
              <div class="bar-wrap">
                <div class="bar-track"><div class="bar-fill" style="width:${barPct}%"></div></div>
                <span class="muted" style="font-size:12px;min-width:42px;">${pct.toFixed(1)}%</span>
              </div>
            </td>
            <td class="muted">${fmtDate(r.last_used_at)}</td>
          </tr>
        `;
      }).join('');
    }

    const dayTotals = new Map();
    for (const row of byDay) {
      const cur = dayTotals.get(row.day) || { request_count: 0, total_tokens: 0 };
      cur.request_count += row.request_count || 0;
      cur.total_tokens += row.total_tokens || 0;
      dayTotals.set(row.day, cur);
    }
    const days = [...dayTotals.keys()].sort().reverse();
    const dayBody = document.getElementById('dayTableBody');
    if (!days.length) {
      dayBody.innerHTML = `<tr><td colspan="3" class="muted">Chưa có dữ liệu.</td></tr>`;
    } else {
      dayBody.innerHTML = days.map((day) => {
        const t = dayTotals.get(day);
        return `<tr><td>${day}</td><td>${fmt(t.request_count)}</td><td>${fmt(t.total_tokens)}</td></tr>`;
      }).join('');
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  refreshBtn.addEventListener('click', load);
  daysSelect.addEventListener('change', load);
  load();
</script>
</body>
</html>
